# The HSC control-ground-constant GREAT3-like configuration script.

# The script needs to know about the HSC pixel scale.  We set it up here so it can be used
# self-consistently throughout.
eval_variables:
    fpixel_scale : &pixel_scale 0.168

# This script uses an HSC-specific set of selection criteria, which is much more lax than
# the one used for GREAT3.
modules:
    - hsc_reject

psf:
    type: InterpolatedImage

    # This means the psf should change per image, not per object as would be the default.
    index_key : image_num

    # This is the filename with 20k random coaddPSFs.  Reading from it is a bit slow, but
    # we only have to do this once for every large 100x100 image, so I'm not worried about
    # optimizing this step.
    image : rand_hsc_wide_psfs_rand.fits.gz
    # We use hdu = file number for now.  This means that we don't get different PSF
    # realizations when we make new sets of simulations), unless we reset this from the
    # command line.
    hdu :
        type: Eval
        str: 'file_num'
    # We don't have to worry about flux normalization, because they were already normalized
    # to one.

gal:
    # Galaxies were based on parametric fits to COSMOS galaxies.
    type: COSMOSGalaxy
    gal_type: parametric
    index: { type: Random }

    # Randomly spin the original profile
    rotate: { type: Random }

    # Flux offset between HSC images and COSMOS images to get calibration right.
    scale_flux: 2.587

stamp:
    # Use a Ring type with num=2 to do pairs of 90 degree rotated galaxies.
    # Note that selection criteria get imposed in a way that eliminates either both galaxies in
    # the pair, or neither.
    # Also note that if we don't want to do shape noise cancellation, we can simply use
    # "stamp.num=1" as an option on the command line when calling galsim to run this script, 
    # and it will remove the ring test.
    type: Ring
    num: 2

    # This was just 1 for constant shear branches.
    magnification: 1

    # The shear was chosen randomly within an annulus with 0.01 < |g| < 0.05.
    shear:
        type: GBeta
        # Change the shear every image, not every object.
        index_key : image_num
        g:
            # The probability distribution is linear in |g|: P(g) ~ g. So equal probability per
            # area within the annulus.  (RandomDistribution automatically renormalizes to have
            # the total integrated probability equal to 1.0.)
            type: RandomDistribution
            function: x
            x_min: 0.01
            x_max: 0.05
        beta: { type: Random }

    # Specify a minimum flux fraction in each postage stamp.
    # The idea is that if the galaxy is drawn into the postage stamp of size stamp_size (see image
    # field) then the galaxy gets chucked out and a new one is selected.  This will depend not only
    # on the galaxy parameters but the PSF as well, since the cut is imposed on the PSF-convolved
    # object.
    min_flux_frac: 0.99

    # We need to specify a drawing method.  The default ('auto') is not what we want, because it
    # will convolve with a pixel response.  The HSC coaddPSFs already include the pixel response,
    # so we do not want to include it twice.  We therefore have to explicitly tell GalSim not to
    # include it at the stage when we convolve the galaxy and PSF.
    draw_method: no_pixel

    # Also use a custom module to apply other cuts: SNR and resolution.
    reject:
        type: HSCReject

image:
    type: Tiled
    nx_tiles: 100
    ny_tiles: 100
    stamp_size: 64
    # Changed to HSC pixel scale.  Need to do this self-consistently here and below.
    pixel_scale: *pixel_scale

    random_seed: 31415

    # Scramble the order of the ring pairs, so they aren't next to each other
    order: random

    # Correlated noise patterns taken from HSC coadd images, along with noise variances
    # taken from a file from Bob (based on random locations in the HSC Wide area).
    noise:
        type: COSMOS
        file_name: correlation.fits
        cosmos_scale: *pixel_scale
        variance: {type: Catalog, col: 'var', index: {type: Eval, str: 'file_num'}}

    # Offset
    offset:
        type: XY
        x: { type: Random, min: -1.0, max: 1.0 }
        y: { type: Random, min: -1.0, max: 1.0 }

    # This means the code will parallelize the creation of a single output file,
    # splitting up the postage stamps among the available cores.
    # This is normally overridden by the output.nproc item below, so the parellelization
    # will be done over files instead.  But if you modify this to only do one file or
    # set output.nproc=1, then this stamp-based parallelization will turn on.
    nproc: 1

    # Sometimes the ffts need to be a bit bigger than is allowed by default...
    gsparams: {maximum_fft_size: 10240}

input:
    cosmos_catalog :
        # Use the sample with F814W < 25.2
        sample: 25.2

        # Make sure we use some cuts on postage stamp and fit quality as in GREAT3, specified using
        # the exclusion_level keyword.  Currently the selected value "marginal" is in fact the
        # default, but specify it in case that changes in future.
        exclusion_level: marginal

    catalog :
        # Read in the set of noise variances (randomized).
        file_name: variance_v2_rand.fits

output:
    type: Fits
    dir: control/ground/constant
    file_name:
        type: FormattedStr
        # The numbers in the file_name are subfield and epoch number.
        # This branch only has one epoch, so epoch is always 0 here.
        # Note that to accommodate possibly >1000 images, I've changed the filename format to %04d.
        format: image-%04d-%1d.fits
        items:
        - { type: Sequence, nitems: 800 }
        - 0

    # The full Great3 had 200 files, but we are going to start with 800.  
    # Note that to run fewer files than this, you can change this
    # from the command line as `galsim cgc.yaml output.nfiles=10` say.  Likewise for any other
    # parameters in the configuration.  This is often more convenient than changing the original
    # YAML configuration file.
    nfiles: 800

    # This means the code will parallelize across the different files, doing a full
    # output file in each core at a time.
    # This is generally better than image.nproc, since it doesn't require as much interprocess
    # communication, which can be rather slow.
    nproc: 20

    # This lets you rerun the code if there were I/O issues and it will just write the
    # missing files.  (Potentially ones that have been deleted because they were corrupted.)
    noclobber: true

    # Output truth catalogs with some of the generated values
    truth:
        file_name :
            type: FormattedStr
            format: epoch_catalog-%04d-%1d.fits
            items:
            - { type: Sequence, nitems: 800 }
            - 0
        columns:
            # PSF information is uniquely determined by the
            # multi-extension FITS file containing the PSFs, along with the image number.
            # Also note that all of mu, g1, g2, var, psf_sigma, psf_e1, psf_e2 are the same for all
            # objects in a given file, so technically they could be stored in a single dict for each
            # file. However, I am taking the lazy route and storing them as columns in the output
            # catalogs.
            num: obj_num
            x: "$(@image_pos).x"
            y: "$(@image_pos).y"
            dx: image.offset.x
            dy: image.offset.y
            cosmos_index: "$(@gal).original.index"
            theta: "$(@gal.rotate + @stamp.index * math.pi/@stamp.num * galsim.radians).rad()"
            mu: stamp.magnification
            g1: "$(@stamp.shear).g1"
            g2: "$(@stamp.shear).g2"
            var: image.noise.variance
            psf_sigma: psf_sigma
            psf_e1: psf_e1
            psf_e2: psf_e2
            snr: ideal_snr
            resolution: resolution
            # The parametric components aren't really available here.
            # So we don't have:
            #   bulge_beta_radians
            #   bulge_q
            #   bulge_flux
            #   bulge_hlr
            #   bulge_n
            #   dist_beta_radians
            #   disk_q
            #   disk_flux
            #   disk_hlr
            # Instead, we only have cosmos_index and theta, which covers the same
            # information, but in a less specific way.  Here cosmos_index is the
            # index into the full COSMOS catalog, before application of any cuts at all.
            # (Not even the rejection of marginal postage stamps.)
            # So if you want to retrieve the true galaxy properties for the galaxies,
            # you should read in the COSMOSCatalog using exclusion_level=None, in which
            # case you can use these indices, or just read in the catalog directly using
            # pyfits.
